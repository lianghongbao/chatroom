# configs/config.yaml
#
# chatroom-message 进程配置。与 user / friend / conversation 进程共用
# nacos/DB/Redis,差别:
#   - server 端口 8003/9003(避免和其它进程同时本地启动时冲突)
#   - service_name 默认 chatroom-message
#
# 三层职责和别的进程一致。
#
# 跨服务调用：本进程通过 nacos discovery 解析 "chatroom-conversation" 端点
# (在 app/message/service/internal/data/remote_conversation.go 写死),不依赖 conversation
# 进程的端口 —— nacos 自动负载均衡。
#
# 消息广播：发消息后往 Redis Pub/Sub 的 chatroom:msg:{conversationId} 频道
# 发一条,ws-gateway 订阅各会话频道并推给对应连接。

server:
  http:
    addr: 0.0.0.0:8003
    timeout: 30s
  grpc:
    addr: 0.0.0.0:9003
    timeout: 30s

data:
  database:
    driver: mysql
    source: "${DB_SOURCE}"
    debug: false
    # 表结构由 ent 增量迁移管：启动时比对现状，只发必要的 ALTER TABLE
    # （加列 / 改列宽 / 补索引）。改 ent schema 后重启服务即自动对齐。
    # 注意：ent 不删列 —— 废弃的列要手工 DROP。
    auto_migrate: true
    # 连接池。连接额度是所有服务共享的，不是每个服务各有一份。
    max_open_conns: 10
    max_idle_conns: 5
    conn_max_lifetime: 1800s
    conn_max_idle_time: 300s
  redis:
    addr: "${REDIS_ADDR}"
    read_timeout: 0.2s
    write_timeout: 0.2s

auth:
  jwt_secret: "${AUTH_JWT_SECRET}"
  token_ttl: 3600s
  access_ttl: 900s
  refresh_ttl: 604800s
  token_issuer: chatroom
  login_max_fail: 5
  login_lock_ttl: 900s
  # 服务间内部调用凭证。调 conversation 的成员身份 / 未读数端点时用
  # X-Internal-Token 头携带。
  #
  # 留空的后果比其它进程严重：成员身份确认不了 → 发消息一律拒绝
  # (ErrMessageConversationUnavailable)。这是有意的 —— fail open 等于
  # 谁都能往别人的会话里塞消息。
  internal_secret: "${AUTH_INTERNAL_SECRET:}"
  # message 域没有 Register/Login,但保留 user 域端点便于 SSO 替换时一处搞定。
  skip_operations:
    - /api.user.v1.User/Register
    - /api.user.v1.User/Login

observability:
  metrics_addr: ""
  tracing_endpoint: '${OTEL_EXPORTER_OTLP_ENDPOINT:""}'
  service_name: "${NACOS_SERVICE_NAME:chatroom-message}"
  unauth_sample_rate: 0.1
