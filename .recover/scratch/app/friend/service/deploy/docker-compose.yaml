# 本地一键启动基础设施：MySQL + Redis + Nacos + Jaeger
#
# 只管「底座」，不管业务服务 —— 业务服务用 `make run-all` 起（本地开发
# 改代码要频繁重启，容器化反而碍事）。要连业务服务一起容器化，见
# deploy/k8s/ 下的清单。
#
#   docker compose -f deploy/docker-compose.yaml up -d
#   docker compose -f deploy/docker-compose.yaml down
#
# 起的容器跟本地已有的是冲突的 —— 端口一样。本机已经在跑原生 Redis/Nacos
# 的话，先停掉再起这份。

name: chatroom

services:
  mysql:
    image: mysql:8.0
    container_name: chatroom-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: test
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    container_name: chatroom-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  jaeger:
    image: jaegertracing/all-in-one:1.71.0
    container_name: chatroom-jaeger
    restart: unless-stopped
    environment:
      # 内存存储，重启丢 trace —— 本地开发够用，生产换 Tempo 或 Jaeger+ES。
      SPAN_STORAGE_TYPE: memory
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC ← 服务端 tracing_endpoint 指这个

  nacos:
    image: nacos/nacos-server:v3.2.4
    container_name: chatroom-nacos
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # 单机模式（standalone）用内嵌 derby 存元数据，不依赖 MySQL。
      MODE: standalone
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_IDENTITY_KEY: serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: security
      NACOS_AUTH_TOKEN: SecretKey012345678901234567890123456789012345678901234567890123456789
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs

volumes:
  mysql-data:
  redis-data:
  nacos-data:
  nacos-logs:
