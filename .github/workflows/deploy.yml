# chatroom 五个服务的镜像 build + deploy 流水线
#
# 依赖 GitHub Vars(明文配置)+ Secrets(凭证)+ ECS self-hosted runner
#
# 与 local-life-api 的差异:
#   - 五个服务,用 matrix 并行 build
#   - 镜像名固定 chatroom/chatroom-<服务>,不靠 IMAGE_NAME 变量
#   - 启动顺序有依赖(见 deploy/docker-compose.yml 的 depends_on),
#     部署时**不能**用 --no-deps 一次全起 —— 那样绕过了健康门禁,
#     下游服务会在上游还没注册到 nacos 时就去 discovery,报连接错误。
#     走 deploy/deploy.sh 的编排:先起 nacos、建管理员,再按依赖序起业务服务。
#
# 前置:ECS 上 deploy/.env 必须先填好(见 deploy/README.md)。
# MySQL / Redis 是独立部署的服务,本流水线**不碰**那两个容器。

name: Deploy

on:
  push:
    branches: [main]

jobs:
  build:
    name: Build & push ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      # 五个服务互不依赖,任一失败不该卡住其他四个 —— 但整体仍然失败,
      # 避免推了半个版本上去。fail-fast:false + 整体 gate。
      fail-fast: false
      matrix:
        service: [user, friend, conversation, message, ws-gateway]
    env:
      ACR_REGISTRY_HOST: ${{ vars.ACR_REGISTRY_HOST }}
      ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE }}
      DOCKER_BUILDKIT: 1
    steps:
      - uses: actions/checkout@v4

      - name: Login to ACR
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          echo "▶ ACR login: ${ACR_REGISTRY_HOST}"
          echo "${ACR_PASSWORD}" | docker login \
            --username "${ACR_USERNAME}" \
            --password-stdin "${ACR_REGISTRY_HOST}"
          echo "✅ ACR login OK"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push image
        # 一次 build 打两个 tag:
        #   chatroom-<服务>-<sha>   immutable,精确版本
        #   chatroom-<服务>-latest  mutable pointer,deploy job 拉这个
        run: |
          set -e
          REGISTRY="${ACR_REGISTRY_HOST}/${ACR_NAMESPACE}"
          SERVICE="${{ matrix.service }}"
          IMAGE_NAME="chatroom-${SERVICE}"

          # sha 前 7 位。不能用 Actions 表达式做字符串切片（报
          # "Unexpected symbol"）。GITHUB_SHA 是 shell 环境变量，
          # 用 shell 的 ${VAR::n} 切。
          SHORT_SHA="${GITHUB_SHA::7}"

          IMAGE="${REGISTRY}:${IMAGE_NAME}-${SHORT_SHA}"
          LATEST="${REGISTRY}:${IMAGE_NAME}-latest"

          # 清老 cache metadata,防止遗留 --mount=type=cache 元数据报错
          docker builder prune -af || true

          echo "▶ Building ${IMAGE} + ${LATEST}"
          # --provenance=false --sbom=false 必须保留:
          #   BuildKit(v0.32+) 默认会在镜像 index 里附带一个
          #   application/vnd.oci.empty.v1+json 的 attestation manifest。
          #   阿里云 ACR 个人版不认这个 media type,push 直接被拒:
          #     denied: unknown manifest class for application/vnd.oci.empty.v1+json
          #   关掉证明信息后只推普通 image manifest,ACR 才能收。
          #
          # 构建上下文是**仓库根** —— 整仓一个 go module,本服务依赖同仓的 pkg/ 和 api/。
          docker buildx build \
            --no-cache \
            --pull \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            -t "${IMAGE}" \
            -t "${LATEST}" \
            --push \
            -f "app/${SERVICE}/service/Dockerfile" \
            .

          echo "✅ Pushed ${IMAGE} + ${LATEST}"

  deploy:
    name: Deploy to self-hosted runner
    runs-on: [self-hosted, docker, aliyun]
    needs: build
    concurrency:
      group: ${{ vars.CONCURRENCY_GROUP }}
      cancel-in-progress: true
    env:
      ACR_REGISTRY_HOST: ${{ vars.ACR_REGISTRY_HOST }}
      ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
      IMAGE_PREFIX: ${{ vars.IMAGE_PREFIX }}
      IMAGE_TAG: server-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: .

      - name: Pull images from ACR
        # 五个服务各拉一个 latest,re-tag 成 compose 期望的名字:
        #   ${REGISTRY}:chatroom-<服务>-latest  →  chatroom/chatroom-<服务>:server-latest
        # 凭证从 ${DEPLOY_DIR}/.env 读 REGISTRY_USERNAME / REGISTRY_PASSWORD
        run: |
          set -e
          if [ -f "${DEPLOY_DIR}/.env" ]; then
            set -a; source ${DEPLOY_DIR}/.env; set +a
          fi
          REGISTRY="${ACR_REGISTRY_HOST}/${ACR_NAMESPACE}"
          echo "▶ ACR login: ${REGISTRY}"
          echo "${REGISTRY_PASSWORD}" | docker login \
            --username "${REGISTRY_USERNAME}" \
            --password-stdin "${REGISTRY}"

          PREFIX="${IMAGE_PREFIX:-chatroom}"
          for SERVICE in user friend conversation message ws-gateway; do
            REMOTE_IMAGE="${REGISTRY}:chatroom-${SERVICE}-latest"
            LOCAL_IMAGE="${PREFIX}/chatroom-${SERVICE}:server-latest"
            docker pull "${REMOTE_IMAGE}"
            docker tag "${REMOTE_IMAGE}" "${LOCAL_IMAGE}"
            echo "✅ ${REMOTE_IMAGE} → ${LOCAL_IMAGE}"
          done

      - name: Sync & deploy
        working-directory: ${{ github.workspace }}
        run: |
          set -e

          # 首次部署:创建部署目录
          if [ ! -d "${DEPLOY_DIR}" ]; then
            echo "首次部署,创建 ${DEPLOY_DIR}..."
            mkdir -p "${DEPLOY_DIR}"
          fi
          # chatroom 的 docker-compose.yml 和 deploy.sh 都在 deploy/ 子目录
          cp $GITHUB_WORKSPACE/deploy/docker-compose.yml ${DEPLOY_DIR}/docker-compose.yml
          cp $GITHUB_WORKSPACE/deploy/deploy.sh ${DEPLOY_DIR}/deploy.sh
          chmod +x ${DEPLOY_DIR}/deploy.sh

          # 首次部署:从 .env.example 生成 .env
          if [ ! -f "${DEPLOY_DIR}/.env" ]; then
            if [ -f deploy/.env.example ]; then
              cp deploy/.env.example ${DEPLOY_DIR}/.env
              echo "⚠️ 已创建 ${DEPLOY_DIR}/.env(从 deploy/.env.example),请手动填入真实凭证后再部署"
              exit 1
            else
              echo "❌ 项目无 deploy/.env.example,请手动创建 ${DEPLOY_DIR}/.env 后触发部署"
              exit 1
            fi
          fi

          # 数据存储的网络 —— mysql / redis 在别的 compose project 里,
          # 本 compose 用 external network 连过去。外部网络不会自动创建,
          # 幂等地补一次。
          docker network inspect data-net >/dev/null 2>&1 || \
            docker network create data-net

          # 起服务。走 deploy.sh 而不是裸 docker compose up -d:
          #   1. 先单独起 nacos 并等它健康
          #   2. 建 nacos 管理员账号(nacos 3.x 首次启动不自动建,
          #      没管理员的话五个服务启动即 panic)
          #   3. 再按 depends_on 的健康门禁起五个业务服务
          #
          # **不能**用 --no-deps 一次全起 —— 那会绕过健康门禁,
          # 下游服务在上游还没注册到 nacos 时就去 discovery,报连接错误。
          cd ${DEPLOY_DIR}
          ./deploy.sh up

          docker ps -a
          docker image prune -f
          echo "✅ chatroom deployed"

      - name: Health check
        # 五个服务各探一次 /readyz(探依赖:MySQL / Redis)
        run: |
          set -e
          FAILED=""
          for PORT in 8000 8001 8002 8003 8004; do
            NAME=$(docker ps --filter "publish=$PORT" --format '{{.Names}}' | head -1)
            [ -z "$NAME" ] && NAME="port-${PORT}"
            echo "⏳ 等待 ${NAME} (${PORT}) 健康..."
            OK=0
            for i in $(seq 1 30); do
              if docker exec "${NAME}" curl -sf -m 2 "http://localhost:${PORT}/readyz" >/dev/null 2>&1; then
                echo "✅ ${NAME} 健康(尝试 $i 次)"
                OK=1
                break
              fi
              sleep 2
            done
            if [ "$OK" != "1" ]; then
              echo "⚠️ ${NAME} 30 次未通过健康检查"
              FAILED="${FAILED} ${NAME}"
            fi
          done
          if [ -n "$FAILED" ]; then
            echo "❌ 以下服务不健康:${FAILED}"
            echo "   排查:docker compose logs <服务名>"
            exit 1
          fi
          echo "✅ 五个服务全部健康"
