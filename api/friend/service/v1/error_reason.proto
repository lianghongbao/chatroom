syntax = "proto3";

package api.friend.v1;

option go_package = "chatroom/api/friend/service/v1;v1";
option java_multiple_files = true;
option java_package = "api.friend.v1";
option objc_class_prefix = "APIFriendV1";

// 错误原因。biz 层折叠为对应 kratos error。
// 命名沿用 api.user.v1.ErrorReason 的风格：<DOMAIN>_<CAUSE>。
enum ErrorReason {
  FRIEND_UNSPECIFIED = 0;

  // 通用
  FRIEND_NOT_FOUND = 1;
  // 参数非法（自加好友 / 字段空 / target_id = 0 等）。
  FRIEND_INVALID_ARGUMENT = 2;

  // 业务特有
  // 双方已是好友，重复申请 / 重复添加。
  FRIEND_ALREADY_FRIENDS = 3;
  // 同一方向的 pending 申请已存在，等待对方处理。
  FRIEND_ALREADY_APPLIED = 4;
  // Accept / Reject 找不到对应的 pending 记录（已撤回 / 已处理 / 不存在）。
  FRIEND_PENDING_NOT_FOUND = 5;
  // Accept / Reject 操作者不是这条 pending 的目标方。
  FRIEND_NOT_RECIPIENT = 6;
  // 不能加自己。
  FRIEND_SELF = 7;
  // 限频命中：Apply / Accept / Reject / Remove 任一路径被频控拒绝。
  FRIEND_RATE_LIMITED = 8;
}
