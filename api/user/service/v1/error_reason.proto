syntax = "proto3";

package api.user.v1;

option go_package = "chatroom/api/user/service/v1;v1";
option java_multiple_files = true;
option java_package = "api.user.v1";
option objc_class_prefix = "APIUserV1";

enum ErrorReason {
  USER_UNSPECIFIED = 0;
  USER_NOT_FOUND = 1;
  USER_INVALID_ARGUMENT = 2;
  USER_ALREADY_EXISTS = 3;
  USER_BAD_CREDENTIALS = 4;
  USER_LOGIN_LOCKED = 5;
  USER_REFRESH_INVALID = 6;
  USER_TOKEN_BLACKLISTED = 7;
  // 改密时旧密码错误（与 USER_BAD_CREDENTIALS 共用原因，不暴露区分）。
  USER_INVALID_OLD_PASSWORD = 8;
  // 账号被禁用（status=0）。登录 / 刷新 token 时拦截。
  USER_BANNED = 9;
}
