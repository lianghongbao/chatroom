syntax = "proto3";

package api.user.v1;

option go_package = "chatroom/api/user/service/v1;v1";
option java_multiple_files = true;
option java_package = "api.user.v1";
option objc_class_prefix = "APIUserV1";

import "google/api/annotations.proto";
import "google/protobuf/field_mask.proto";

// 全域约定：uid 由 Authorization Bearer 派生，未携带 token 返 401；
// email / phone 仅「自己看自己」时填充，查他人永远为空（防社工库）。
// UserService 用户服务。
service User {
    // 注册（username 必填；nickname 留空回退 username）。
    rpc Register (RegisterRequest) returns (RegisterReply) {
        option (google.api.http) = {
            post: "/api/user/register"
            body: "*"
        };
    }

    // 登录。返回 access (15m) + refresh (7d) 双 token；token_type="Bearer"。
    rpc Login (LoginRequest) returns (LoginReply) {
        option (google.api.http) = {
            post: "/api/user/login"
            body: "*"
        };
    }

    // refresh 换新一对；旧 refresh 一次性失效（OAuth rotation）。
    rpc RefreshToken (RefreshTokenRequest) returns (LoginReply) {
        option (google.api.http) = {
            post: "/api/user/refresh"
            body: "*"
        };
    }

    // 登出：access 进 Redis 黑名单 (TTL=剩余寿命) + refresh 删除。
    rpc Logout (LogoutRequest) returns (LogoutReply) {
        option (google.api.http) = {
            post: "/api/user/logout"
            body: "*"
        };
    }

    // 当前用户资料。
    rpc GetUser (GetUserRequest) returns (UserInfo) {
        option (google.api.http) = {
            get: "/api/user/info"
        };
    }

    // 更新当前用户；update_mask 列出本次要改的字段，未列字段保留。
    rpc UpdateUser (UpdateUserRequest) returns (UserInfo) {
        option (google.api.http) = {
            put: "/api/user/info"
            body: "*"
        };
    }

    // 改密。旧错 / 用户不存在折叠为同一错误（防撞库枚举），改完强制登出当前会话。
    rpc ChangePassword (ChangePasswordRequest) returns (ChangePasswordReply) {
        option (google.api.http) = {
            post: "/api/user/change_password"
            body: "*"
        };
    }

    // GetUploadToken 签发头像直传凭证。
    //
    // 客户端拿到表单字段后**直接 POST multipart/form-data 到 OSS**，
    // 服务端不碰文件字节。上传完再把 public_url 塞进 UpdateUser 的 avatar 字段。
    //
    // 用 PostObject 而不是预签名 PUT：PostObject 的 policy 能带
    // content-length-range，**OSS 服务端在收数据前就拒掉超限请求** ——
    // 预签名 PUT 做不到这点，只能事后查大小，而那时文件已经落盘了。
    //
    // key 前缀由服务端按当前 uid 拼，客户端改不了 —— 拿着临时凭证也越不出
    // 自己的目录。上传后还要再校验对象存在性和大小。
    rpc GetUploadToken (GetUploadTokenRequest) returns (GetUploadTokenReply) {
        option (google.api.http) = {
            post: "/api/user/upload_token"
            body: "*"
        };
    }

    // 按 ID 查公开资料；目标用户关「对陌生人可见」时折叠 NOT_FOUND。
    rpc GetUserByID (GetUserByIDRequest) returns (UserInfo) {
        option (google.api.http) = {
            get: "/api/user/{id}"
        };
    }

    // 批量按 ID 查公开资料，避免 N+1；不可见 / 不存在的 id 静默剔除。
    rpc GetUsersByIDs (GetUsersByIDsRequest) returns (GetUsersByIDsReply) {
        option (google.api.http) = {
            post: "/api/user/batch"
            body: "*"
        };
    }

    // GetUserByUsername 按用户名精确查公开资料。uid 是 UUIDv7 字符串，用户记不住，
    // 加好友时用用户名找人更现实。
    //
    // 跟 GetUserByID 的区别：**不做「对陌生人可见」判定**。好友申请本来就允许
    // 陌生人互相发起，对方关了可见性就查不到人的话，加好友这条路直接堵死。
    // 返回的资料不含 email / phone。
    //
    // 路由是 /api/user/lookup/username 而不是 /api/user/by_username ——
    // 前者多一段路径，不会被 GetUserByID 的 /api/user/{id} 通配符吃掉
    // （通配符只吃单段路径，且注册在前先匹配）。
    rpc GetUserByUsername (GetUserByUsernameRequest) returns (UserInfo) {
        option (google.api.http) = {
            get: "/api/user/lookup/username"
        };
    }

    // CheckUsernameAvailable 查用户名是否可注册。
    //
    // 注册页「用户名失焦就校验重复」用的探测端点。**只回一个布尔**，
    // 不回任何用户资料 —— 注册页只需要知道「有没有人占用」，
    // 顺带把昵称头像送回去等于白送一份用户画像。
    //
    // 跟 GetUserByUsername 的区别：那个是「找这个人」（加好友），
    // 会返回完整资料；这个是「这个名字能不能用」，语义相反，
    // 也不能靠 404 表达「被占用」—— 前端拿布尔判断，不用解析错误码。
    //
    // 路由是 /api/user/check/username —— **必须两段**。
    // GetUserByID 的 /api/user/{id} 通配符只吃单段路径，且注册在前先匹配；
    // 写成 /api/user/check_username（单段）会被通配符吃掉，
    // 实际打到 GetUserByID，operation 也变成 GetUserByID。
    // 跟 GetUserByUsername 的 /api/user/lookup/username 一个道理。
    //
    // 鉴权：注册时还没登录，这个端点在 auth.skip_operations 白名单里。
    // 限频：复用注册限频桶 —— 否则它就是一条绕过注册限频的枚举通道。
    rpc CheckUsernameAvailable (CheckUsernameAvailableRequest) returns (CheckUsernameAvailableReply) {
        option (google.api.http) = {
            get: "/api/user/check/username"
        };
    }

    // GetUserByPhone 按手机号精确查公开资料。加好友时用户常常只记得手机号。
    //
    // 语义跟 GetUserByUsername 一致：不做「对陌生人可见」判定，手机号全局唯一
    // 所以最多一个结果。返回的资料不含 email / phone。
    //
    // 路由是 /api/user/lookup/phone —— 多一段路径，不会被 GetUserByID 的
    // /api/user/{id} 通配符吃掉。
    rpc GetUserByPhone (GetUserByPhoneRequest) returns (UserInfo) {
        option (google.api.http) = {
            get: "/api/user/lookup/phone"
        };
    }

    // GetFriendProfiles 批量拉「好友可见」的公开资料，供 friend 服务补全好友列表的昵称/头像/注册时间。
    // 跟 GetUsersByIDs 的区别：跳过 is_visible_to_stranger 判定 —— 对方已是好友。
    // 仅供服务间调用，需带 X-Internal-Token（不走用户 JWT）。返回的 UserInfo 不含 email / phone。
    rpc GetFriendProfiles (GetFriendProfilesRequest) returns (GetFriendProfilesReply) {
        option (google.api.http) = {
            post: "/api/user/friend_profiles"
            body: "*"
        };
    }

    // GetConversationMemberProfiles 批量拉「会话成员可见」的公开资料，供 conversation 服务补全会话成员列表。
    //
    // 跟 GetFriendProfiles 的区别：会话成员未必是好友（群聊可以是陌生人拉进来的），
    // 但同会话即互相可见昵称/头像，所以同样跳过 is_visible_to_stranger 判定。
    //
    // 鉴权：仅供服务间调用，需带 X-Internal-Token。返回的 UserInfo 不含 email / phone。
    rpc GetConversationMemberProfiles (GetConversationMemberProfilesRequest) returns (GetConversationMemberProfilesReply) {
        option (google.api.http) = {
            post: "/api/user/conversation_member_profiles"
            body: "*"
        };
    }
}

// GetFriendProfilesRequest 批量拉好友公开资料。
message GetFriendProfilesRequest {
    // 待查用户 uid 列表。单次最多 200 个，超出截断。
    repeated string ids = 1;
}

// GetFriendProfilesReply 返回的公开资料，不含 email / phone。
message GetFriendProfilesReply {
    // 顺序与 ids 无关，caller 按 user.id 自行索引。
    repeated UserInfo users = 1;
}

// GetConversationMemberProfilesRequest 批量拉会话成员公开资料。
message GetConversationMemberProfilesRequest {
    // 待查用户 uid 列表。单次最多 200 个，超出截断。
    repeated string ids = 1;
}

// GetConversationMemberProfilesReply 返回的公开资料，不含 email / phone。
message GetConversationMemberProfilesReply {
    // 顺序与 ids 无关，caller 按 user.id 自行索引。
    repeated UserInfo users = 1;
}

// UserInfo 用户资料。email/phone 仅「自己看自己」时填充（service 层清理）。
message UserInfo {
    // 用户 uid，UUIDv7 字符串，不透明且不可枚举。
    string id = 1;
    string username = 2;
    string nickname = 3;
    string avatar = 4;
    // Unix 秒，由客户端按 locale 格式化。
    int64 created_at = 5;
    optional string email = 6;
    optional string phone = 7;
}

message RegisterRequest {
  string username = 1;
  string password = 2;
  // 留空回退到 username。
  string nickname = 3;
  // 手机号（可选）。加好友时用它找人，全局唯一。
  // 留空 = 不填；已被人占用则注册失败。
  string phone = 4;
  // 邮箱（可选）。**不加唯一索引、也不做格式校验** —— 目前只是个备注字段，
  // 将来接「验证码改密 / 找回密码」时再视业务收紧。
  // 留空 = 不填。
  string email = 5;
}

message RegisterReply {
  // 新建用户的 uid。
  string id = 1;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginReply {
  // 旧字段保留兼容老客户端。
  string token = 1;
  string user_id = 2;
  string access_token = 3;
  string refresh_token = 4;
  // access_token 剩余秒数，前端按此提前刷新。
  int64 expires_in = 5;
  // OAuth2：固定 "Bearer"。
  string token_type = 6;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message LogoutRequest {
  // access 的 jti 由 middleware 注入 ctx，客户端只需传 refresh。
  string refresh_token = 1;
}

message LogoutReply {
}

message GetUserRequest {
}

message UpdateUserRequest {
  string nickname = 1;
  string avatar = 2;
  // 列出本次要更新的字段路径；未列出字段保持原值。
  google.protobuf.FieldMask update_mask = 3;
  // 手机号。跟 nickname / avatar 一样，**只在 update_mask 列出 "phone" 时才生效**。
  // 传空串表示「清空手机号」。
  string phone = 4;
  // 邮箱。跟 phone 一样，**只在 update_mask 列出 "email" 时才生效**。
  // 传空串表示「清空邮箱」。不唯一、不校验格式。
  string email = 5;
}

message ChangePasswordRequest {
  string old_password = 1;
  string new_password = 2;
  // 当前会话的 refresh token。改密后要把它一起撤销 ——
  // 只拉黑 access token 的话，refresh token 还在，攻击者（或另一台设备）
  // 还能用它换出新 access token。
  // 不传就只能撤销 access token（老客户端兼容路径）。
  string refresh_token = 3;
}

message ChangePasswordReply {
}

message GetUserByIDRequest {
  string id = 1;
}

// GetUsersByIDsRequest 批量按 ID 列表查公开资料。单次最多 200 个，超出截断。
message GetUsersByIDsRequest {
  repeated string ids = 1;
}

// GetUsersByIDsReply 顺序与 ids 无关，caller 按 user.id 自行索引。
message GetUsersByIDsReply {
  repeated UserInfo users = 1;
}

// GetUserByUsernameRequest 按用户名精确查公开资料。
message GetUserByUsernameRequest {
  // 用户名。精确匹配，**区分大小写** —— alice 和 ALICE 是两个不同的账号。
  string username = 1;
}

// GetUserByPhoneRequest 按手机号精确查公开资料。
message GetUserByPhoneRequest {
  // 手机号。精确匹配（中国大陆 11 位）。
  string phone = 1;
}

// CheckUsernameAvailableRequest 查用户名是否可注册。
message CheckUsernameAvailableRequest {
  // 用户名。**区分大小写** —— alice 和 ALICE 是两个不同的账号。
  string username = 1;
}

// CheckUsernameAvailableReply 用户名是否可用。
message CheckUsernameAvailableReply {
  // true = 没人用过，可以注册。
  //
  // false = 已被占用。注意这是**快照**，不是承诺 ——
  // 到真正提交注册时可能被别人抢走，那时后端会以
  // USER_ALREADY_EXISTS 拒绝，前端照样要处理这个错误。
  //
  // **用 optional 而不是裸 bool**：HTTP 响应走标准 encoding/json codec，
  // 裸 bool 的 tag 是 `json:"available,omitempty"` —— false 会被整个省略，
  // 前端拿到的是 undefined 而不是 false。optional 让字段变成指针，
  // 序列化时一定会出现在 JSON 里。
  optional bool available = 1;
}

// GetUploadTokenRequest 签发头像直传凭证。
message GetUploadTokenRequest {
  // 文件后缀，不带点，如 "png"。必须在白名单内。
  string ext = 1;
}

// GetUploadTokenReply 直传凭证 —— OSS PostObject 表单。
message GetUploadTokenReply {
  // OSS 上传地址，客户端 POST 到这里。
  //
  // 例 "https://chatroomoss.oss-cn-guangzhou.aliyuncs.com"。
  // PostObject 的 URL 只有 bucket 域名，object key 走表单域传。
  string host = 1;
  // 表单字段。客户端原样塞进 FormData 提交。
  //
  // 包含 key / policy / x-oss-signature-version / x-oss-credential /
  // x-oss-date / x-oss-security-token / x-oss-signature /
  // success_action_status 这几个域 —— **别改值**，改了就签名对不上。
  //
  // file 域不放这里 —— 文件本身由客户端从本地读。
  map<string, string> fields = 2;
  // object key，fields 里也有，这里单独给一份方便客户端拼完整 URL。
  string file_key = 3;
  // 上传后可访问的地址。客户端上传完把它塞进 UpdateUser 的 avatar。
  string public_url = 4;
  // 过期时间，Unix 秒。
  int64 expire_at = 5;
  // 允许的最大字节数，0 表示不限。
  //
  // **服务端强制** —— policy 的 content-length-range 里带着这个值，
  // 超限的请求 OSS 直接拒（EntityTooLarge），文件不会落盘。
  // 这个字段是给客户端的提示，让它能在上传前就拦下超限文件，
  // 省一次注定失败的直传。
  int64 max_size = 6;
}
