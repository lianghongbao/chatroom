syntax = "proto3";

package api.message.v1;

option go_package = "chatroom/api/message/service/v1;v1";
option java_multiple_files = true;
option java_package = "api.message.v1";
option objc_class_prefix = "APIMessageV1";

// 错误原因。biz 层折叠为对应 kratos error。
// 命名沿用 api.user.v1 / api.friend.v1 / api.conversation.v1 的风格：<DOMAIN>_<CAUSE>。
enum ErrorReason {
  MESSAGE_UNSPECIFIED = 0;

  // 通用
  // 消息不存在。
  MESSAGE_NOT_FOUND = 1;
  // 参数非法（内容为空 / 超过长度上限 / 会话 id 为 0 等）。
  MESSAGE_INVALID_ARGUMENT = 2;

  // 业务特有
  // 调用方不是该会话的成员 —— 不能发消息，也不能读消息。
  MESSAGE_NOT_MEMBER = 3;
  // 消息内容超长。
  MESSAGE_CONTENT_TOO_LONG = 4;
  // 会话服务不可达 —— 没法确认成员身份。
  // 这是「拒绝」而非「降级放行」：身份没确认就放行等于让任何人都能往别人的会话里发消息。
  MESSAGE_CONVERSATION_UNAVAILABLE = 5;
}
