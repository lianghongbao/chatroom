openapi: 3.0.3
info:
    title: Conversation API
    description: |-
        ConversationService 会话服务。
         单聊（type=1）由成员集合唯一确定，重复创建复用同一会话；群聊（type=2）成员可增减，群主唯一。
         成员昵称/头像由 service 层调 user 内部端点批量拉取，不可达时降级为空。
    version: 0.0.1
paths:
    /api/conversation/create:
        post:
            tags:
                - Conversation
            description: CreateConversation 创建会话。单聊幂等（同一对成员返同一会话），群聊总是新建。
            operationId: Conversation_CreateConversation
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/api.conversation.v1.CreateConversationRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.conversation.v1.CreateConversationReply'
    /api/conversation/dissolve:
        post:
            tags:
                - Conversation
            description: |-
                DissolveConversation 解散群聊。仅群主可调用，单聊不支持。
                 会话连同全部成员记录一起删除，不可恢复。
            operationId: Conversation_DissolveConversation
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/api.conversation.v1.DissolveConversationRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.conversation.v1.DissolveConversationReply'
    /api/conversation/get:
        get:
            tags:
                - Conversation
            description: GetConversation 会话详情。仅会话成员可见。
            operationId: Conversation_GetConversation
            parameters:
                - name: id
                  in: query
                  description: 会话 ID。0 视为非法。
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.conversation.v1.GetConversationReply'
    /api/conversation/leave:
        post:
            tags:
                - Conversation
            description: LeaveConversation 主动退群。群主不能退（需先转让群主）。
            operationId: Conversation_LeaveConversation
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/api.conversation.v1.LeaveConversationRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.conversation.v1.LeaveConversationReply'
    /api/conversation/list:
        get:
            tags:
                - Conversation
            description: |-
                ListConversations 列出当前用户的所有会话，按最后活动时间倒序。
                 分页：cursor-based，按 (updated_at DESC, id DESC) 排序。
            operationId: Conversation_ListConversations
            parameters:
                - name: cursor
                  in: query
                  description: 游标：上一次响应的 next_cursor；首次留空。
                  schema:
                    type: string
                - name: pageSize
                  in: query
                  description: 单页大小。1..200 合法，超出折叠到 50 默认。
                  schema:
                    type: integer
                    format: int32
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.conversation.v1.ListConversationsReply'
    /api/conversation/members/add:
        post:
            tags:
                - Conversation
            description: AddMembers 往群聊加成员。仅群主可调用。
            operationId: Conversation_AddMembers
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/api.conversation.v1.AddMembersRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.conversation.v1.AddMembersReply'
    /api/conversation/members/all:
        post:
            tags:
                - Conversation
            description: |-
                ListConversationMembers 列出会话的全部成员（不校验调用方身份，只认内部凭证）。
                 ws-gateway 用它算广播目标。跟 ListMembers 的区别：那个要求调用方是成员。
            operationId: Conversation_ListConversationMembers
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/api.conversation.v1.ListConversationMembersRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.conversation.v1.ListConversationMembersReply'
    /api/conversation/members/list:
        get:
            tags:
                - Conversation
            description: ListMembers 列出会话成员。仅会话成员可见。
            operationId: Conversation_ListMembers
            parameters:
                - name: conversationId
                  in: query
                  description: 会话 ID。
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.conversation.v1.ListMembersReply'
    /api/conversation/members/profile:
        get:
            tags:
                - Conversation
            description: |-
                GetMemberProfile 查会话里某个成员的公开资料。

                 跟 user 服务的 GetUserByID 区别：**跳过 is_visible_to_stranger 判定** ——
                 同在一个会话里就已经互相可见昵称头像了，再要求对方「对陌生人可见」是自相矛盾。
                 同理也不暴露 email / phone。

                 仅会话成员可查；不是成员返 NOT_FOUND（不泄露会话是否存在）。
            operationId: Conversation_GetMemberProfile
            parameters:
                - name: conversationId
                  in: query
                  description: 会话 ID。
                  schema:
                    type: string
                - name: userId
                  in: query
                  description: 要查的成员 uid。必须是该会话的成员。
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.conversation.v1.GetMemberProfileReply'
    /api/conversation/members/remove:
        post:
            tags:
                - Conversation
            description: RemoveMember 踢人。仅群主可调用，且不能踢自己。
            operationId: Conversation_RemoveMember
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/api.conversation.v1.RemoveMemberRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.conversation.v1.RemoveMemberReply'
    /api/conversation/membership/check:
        post:
            tags:
                - Conversation
            description: |-
                CheckMembership 查某个 uid 是不是会话成员。
                 会话不存在和「不是成员」都返 is_member=false。
            operationId: Conversation_CheckMembership
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/api.conversation.v1.CheckMembershipRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.conversation.v1.CheckMembershipReply'
    /api/conversation/owner/transfer:
        post:
            tags:
                - Conversation
            description: |-
                TransferOwner 转让群主。仅当前群主可调用，新群主必须是群成员。
                 转让后才能退群。
            operationId: Conversation_TransferOwner
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/api.conversation.v1.TransferOwnerRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.conversation.v1.TransferOwnerReply'
    /api/conversation/unread/batch_update:
        post:
            tags:
                - Conversation
            description: |-
                UpdateUnreadBatch 批量更新一个会话里多个成员的未读数。
                 消息服务发消息后的未读 fan-out 用它，避免 N 次跨进程调用。
            operationId: Conversation_UpdateUnreadBatch
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/api.conversation.v1.UpdateUnreadBatchRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.conversation.v1.UpdateUnreadBatchReply'
    /api/conversation/unread/clear:
        post:
            tags:
                - Conversation
            description: |-
                ClearUnread 把某个成员的会话级未读数清零。
                 单独一个端点而非 GetUnread + UpdateUnread(-n)：两步之间有窗口，并发消息会让未读数清不干净。
            operationId: Conversation_ClearUnread
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/api.conversation.v1.ClearUnreadRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.conversation.v1.ClearUnreadReply'
    /api/conversation/unread/get:
        post:
            tags:
                - Conversation
            description: GetUnread 查某个成员的会话级未读数。
            operationId: Conversation_GetUnread
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/api.conversation.v1.GetUnreadRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.conversation.v1.GetUnreadReply'
    /api/conversation/unread/list:
        post:
            tags:
                - Conversation
            description: ListUnread 查某个 uid 在所有会话的未读数。
            operationId: Conversation_ListUnread
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/api.conversation.v1.ListUnreadRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.conversation.v1.ListUnreadReply'
    /api/conversation/unread/update:
        post:
            tags:
                - Conversation
            description: |-
                UpdateUnread 更新会话级未读数。
                 delta 正增负减，归零后不再往下减。只影响 conversation_id + user_id 指定的那个成员。
            operationId: Conversation_UpdateUnread
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/api.conversation.v1.UpdateUnreadRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.conversation.v1.UpdateUnreadReply'
    /api/conversation/update:
        post:
            tags:
                - Conversation
            description: UpdateConversation 改群名。仅群主可调用，单聊不支持。
            operationId: Conversation_UpdateConversation
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/api.conversation.v1.UpdateConversationRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/api.conversation.v1.UpdateConversationReply'
    /api/conversation/user_conversations:
        post:
            tags:
                - Conversation
            description: |-
                ListUserConversations 列某个用户参与的所有会话 id（不校验调用方身份，只认内部凭证）。
                 ws-gateway 用它找「用户的同伴在哪些会话里」以便上线通知。跟 ListConversations 的区别：那个要用户 JWT 且返回详情。
            operationId: Conversation_ListUserConversations
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/api.conversation.v1.ListUserConversationsRequest'
                required: true
