                                $ref: '#/components/schemas/api.conversation.v1.ListUserConversationsReply'
components:
    schemas:
        api.conversation.v1.AddMembersReply:
            type: object
            properties:
                memberCount:
                    type: integer
                    description: 加入后的成员数。
                    format: uint32
                addedCount:
                    type: integer
                    description: 实际新加入的人数（已在会里的不计入）。
                    format: uint32
        api.conversation.v1.AddMembersRequest:
            type: object
            properties:
                conversationId:
                    type: string
                    description: 会话 ID。
                memberIds:
                    type: array
                    items:
                        type: string
                    description: 要加入的成员 uid 列表。至少 1 人。
            description: AddMembersRequest 往群聊加人。
        api.conversation.v1.CheckMembershipReply:
            type: object
            properties:
                isMember:
                    type: boolean
                    description: 该 uid 是不是会话成员。会话不存在时也是 false。
        api.conversation.v1.CheckMembershipRequest:
            type: object
            properties:
                conversationId:
                    type: string
                    description: 会话 ID。
                userId:
                    type: string
                    description: 要查的 uid。
            description: CheckMembershipRequest 查成员身份。
        api.conversation.v1.ClearUnreadReply:
            type: object
            properties:
                unreadCount:
                    type: integer
                    description: 清零后的未读数（正常是 0）。
                    format: uint32
        api.conversation.v1.ClearUnreadRequest:
            type: object
            properties:
                conversationId:
                    type: string
                    description: 会话 ID。
                userId:
                    type: string
                    description: 成员 uid。
            description: ClearUnreadRequest 清零未读数。
        api.conversation.v1.ConversationInfo:
            type: object
            properties:
                id:
                    type: string
                    description: 会话 ID。
                type:
                    type: integer
                    description: 会话类型。
                    format: enum
                name:
                    type: string
                    description: 会话名。群聊为群名；单聊为空（前端用对方昵称展示）。
                ownerId:
                    type: string
                    description: 群主 uid。单聊为 0。
                memberCount:
                    type: integer
                    description: 成员数。
                    format: uint32
                memberIds:
                    type: array
                    items:
                        type: string
                    description: 成员 uid 列表。
                memberNicknames:
                    type: array
                    items:
                        type: string
                    description: |-
                        成员昵称，顺序与 member_ids 对齐。
                         长度恒等于 member_ids，资料没拉到时该位置为空字符串占位，前端可按下标直接对应。
                memberAvatars:
                    type: array
                    items:
                        type: string
                    description: 成员头像，顺序与 member_ids 对齐。语义同 member_nicknames。
                lastMessage:
                    type: string
                    description: 会话最后一条消息摘要。message 服务（P4）上线前为空。
                lastMessageAt:
                    type: string
                    description: 最后一条消息时间（Unix 秒）。message 服务上线前为 0。
                updatedAt:
                    type: string
                    description: 会话最后活动时间（Unix 秒），成员变动或改名时更新。
                createdAt:
                    type: string
                    description: 会话创建时间（Unix 秒）。
            description: ConversationInfo 会话概要。
        api.conversation.v1.CreateConversationReply:
            type: object
            properties:
                conversation:
                    $ref: '#/components/schemas/api.conversation.v1.ConversationInfo'
                reused:
                    type: boolean
                    description: 是否复用了已存在的单聊。true 表示这次没有新建。
        api.conversation.v1.CreateConversationRequest:
            type: object
            properties:
                type:
                    type: integer
                    description: 会话类型。缺省按成员数推断：2 人 = 单聊，> 2 人 = 群聊。
                    format: enum
                memberIds:
                    type: array
                    items:
                        type: string
                    description: 成员 uid 列表，至少 2 人。不含调用方也可以，服务端会并入。
                name:
                    type: string
                    description: 群聊名。单聊忽略该字段。≤ 128 字符。
            description: CreateConversationRequest 创建会话。
        api.conversation.v1.DissolveConversationReply:
            type: object
            properties: {}
        api.conversation.v1.DissolveConversationRequest:
            type: object
            properties:
                conversationId:
                    type: string
                    description: 会话 ID。
            description: DissolveConversationRequest 解散群聊。
        api.conversation.v1.GetConversationReply:
            type: object
            properties:
                conversation:
                    $ref: '#/components/schemas/api.conversation.v1.ConversationInfo'
        api.conversation.v1.GetMemberProfileReply:
            type: object
            properties:
                id:
                    type: string
                    description: 成员 uid。
                username:
                    type: string
                    description: 用户名。
                nickname:
                    type: string
                    description: 昵称。
                avatar:
                    type: string
                    description: 头像地址。
                createdAt:
                    type: string
                    description: 加入时间，Unix 秒。
            description: GetMemberProfileReply 成员的公开资料。
        api.conversation.v1.GetUnreadReply:
            type: object
            properties:
                unreadCount:
                    type: integer
                    description: 未读数。
                    format: uint32
        api.conversation.v1.GetUnreadRequest:
            type: object
            properties:
                conversationId:
                    type: string
                    description: 会话 ID。
                userId:
                    type: string
                    description: 成员 uid。
            description: GetUnreadRequest 查未读数。
        api.conversation.v1.LeaveConversationReply:
            type: object
            properties: {}
        api.conversation.v1.LeaveConversationRequest:
            type: object
            properties:
                conversationId:
                    type: string
                    description: 会话 ID。
            description: LeaveConversationRequest 退群。
        api.conversation.v1.ListConversationMembersReply:
            type: object
            properties:
                memberIds:
                    type: array
                    items:
                        type: string
                    description: 成员 uid 列表，升序。
        api.conversation.v1.ListConversationMembersRequest:
            type: object
            properties:
                conversationId:
                    type: string
                    description: 会话 ID。
            description: ListConversationMembersRequest 列会话全部成员。
        api.conversation.v1.ListConversationsReply:
            type: object
            properties:
                conversations:
                    type: array
                    items:
                        $ref: '#/components/schemas/api.conversation.v1.ConversationInfo'
                nextCursor:
                    type: string
                    description: 下一页游标。空表示已到末页。
        api.conversation.v1.ListMembersReply:
            type: object
            properties:
                memberIds:
                    type: array
                    items:
                        type: string
                    description: 成员 uid 列表，升序。
                memberNicknames:
                    type: array
                    items:
                        type: string
                    description: 成员昵称，顺序与 member_ids 对齐。长度恒等于 member_ids，缺资料时为空串占位。
                memberAvatars:
                    type: array
                    items:
                        type: string
                    description: 成员头像，顺序与 member_ids 对齐。语义同 member_nicknames。
        api.conversation.v1.ListUnreadReply:
            type: object
            properties:
                perConversation:
                    type: object
                    additionalProperties:
                        type: integer
                        format: uint32
                    description: 各会话的未读数，key 是 conversation_id。
        api.conversation.v1.ListUnreadRequest:
            type: object
            properties:
                userId:
                    type: string
                    description: 成员 uid。
            description: ListUnreadRequest 查所有会话的未读数。
        api.conversation.v1.ListUserConversationsReply:
            type: object
            properties:
                conversationIds:
                    type: array
                    items:
                        type: string
                    description: 会话 id 列表，升序。
        api.conversation.v1.ListUserConversationsRequest:
            type: object
            properties:
                userId:
                    type: string
                    description: 用户 uid。
            description: ListUserConversationsRequest 列某用户参与的所有会话。
        api.conversation.v1.RemoveMemberReply:
            type: object
            properties:
                memberCount:
                    type: integer
                    description: 踢人后的成员数。
                    format: uint32
        api.conversation.v1.RemoveMemberRequest:
            type: object
            properties:
                conversationId:
                    type: string
                    description: 会话 ID。
                memberId:
                    type: string
                    description: 要踢的成员 uid。
            description: RemoveMemberRequest 踢人。
        api.conversation.v1.TransferOwnerReply:
            type: object
            properties:
                conversation:
                    allOf:
                        - $ref: '#/components/schemas/api.conversation.v1.ConversationInfo'
                    description: 转让后的会话。owner_id 是新群主。
        api.conversation.v1.TransferOwnerRequest:
            type: object
            properties:
                conversationId:
                    type: string
                    description: 会话 ID。
                newOwnerId:
                    type: string
                    description: 新群主 uid。必须是当前群成员。
            description: TransferOwnerRequest 转让群主。
        api.conversation.v1.UpdateConversationReply:
            type: object
            properties:
                conversation:
                    $ref: '#/components/schemas/api.conversation.v1.ConversationInfo'
        api.conversation.v1.UpdateConversationRequest:
            type: object
            properties:
                conversationId:
                    type: string
                    description: 会话 ID。
                name:
                    type: string
                    description: 新群名。≤ 128 字符，不能为空。
            description: UpdateConversationRequest 改群名。
        api.conversation.v1.UpdateUnreadBatchReply:
            type: object
            properties:
                updated:
                    type: integer
                    description: 成功更新的成员数。
                    format: uint32
        api.conversation.v1.UpdateUnreadBatchRequest:
            type: object
            properties:
                conversationId:
                    type: string
                    description: 会话 ID。
                userIds:
                    type: array
                    items:
                        type: string
                    description: 要加未读的成员 uid 列表。
                delta:
                    type: integer
                    description: 增量。正数增加，负数减少。
                    format: int32
            description: |-
                UpdateUnreadBatchRequest 批量给一个会话里的多个成员加未读数。

                 消息服务发一条消息要给除发送方外的所有成员加未读 —— 逐个调
                 UpdateUnread 是 N 次跨进程调用（500 人的群 = 500 次往返）。
                 这个端点把整个 fan-out 压成一次。
        api.conversation.v1.UpdateUnreadReply:
            type: object
            properties:
                unreadCount:
                    type: integer
